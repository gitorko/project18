version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskprocessor-postgres
    environment:
      POSTGRES_DB: taskprocessor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Run multiple instances of the task processor to test distributed behavior
  # task-processor-1:
  #   build: .
  #   container_name: task-processor-1
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskprocessor
  #     TASK_PROCESSOR_WORKER_ID: worker-1
  #     TASK_PROCESSOR_POLLER_POOL_SIZE: 10
  #   ports:
  #     - "8081:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  # task-processor-2:
  #   build: .
  #   container_name: task-processor-2
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskprocessor
  #     TASK_PROCESSOR_WORKER_ID: worker-2
  #     TASK_PROCESSOR_POLLER_POOL_SIZE: 10
  #   ports:
  #     - "8082:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  postgres_data:
